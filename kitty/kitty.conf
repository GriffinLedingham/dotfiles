allow_remote_control socket-only
listen_on unix:/tmp/kitty

#hide_window_decorations titlebar-only
#macos_hide_titlebar yes
#
# This is the most important part
#hide_window_decorations titlebar-only

# This makes the buttons blend into your background color
macos_titlebar_color background

window_padding_width 10

scrollback_lines 10000

tab_bar_background #293239
tab_bar_style powerline
tab_bar_edge top
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.active_wd} | {tab.active_exe}"

font_family      Fira Code
modify_font cell_width 90%
macos_thicken_font 0.1
font_size        16
bold_font        auto
italic_font      auto
bold_italic_font auto

# Light
#background              #fdf6e3
#foreground              #657b83
#cursor                  #586e75
#selection_background    #475b62
#selection_foreground    #eae3cb
